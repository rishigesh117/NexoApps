name: Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Verify Backend Syntax
        run: |
          node -c backend/server.js
          node -c backend/routes/index.js

      - name: Run ESLint Verification
        run: |
          cd frontend
          npx tsc --noEmit
