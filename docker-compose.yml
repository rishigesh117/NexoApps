version: '3.8'

services:
  nexoapps-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexoapps-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - STORAGE_DRIVER=local
      - JWT_SECRET=nexoapps-production-super-secret-key-2026
    depends_on:
      - nexoapps-postgres
      - nexoapps-redis

  nexoapps-postgres:
    image: postgres:15-alpine
    container_name: nexoapps-db
    restart: always
    environment:
      POSTGRES_USER: nexo_admin
      POSTGRES_PASSWORD: nexo_secure_password_2026
      POSTGRES_DB: nexoapps_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nexoapps-redis:
    image: redis:7-alpine
    container_name: nexoapps-cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
