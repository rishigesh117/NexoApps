version: '3.8'

services:
  nexoapps-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexoapps_api_prod
    restart: always
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://nexo_user:nexo_secret@postgres:5432/nexoapps_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nexoapps_postgres
    restart: always
    environment:
      POSTGRES_USER: nexo_user
      POSTGRES_PASSWORD: nexo_secret
      POSTGRES_DB: nexoapps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_user -d nexoapps_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexoapps_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
